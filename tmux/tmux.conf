# =============================================================================
# Tmux Configuration - Optimized for Neovim Integration
# =============================================================================

# Set prefix to Ctrl-a (easier than default Ctrl-b)
# NOTE: On macOS, you may need to disable "Select All" shortcut in your terminal app
# iTerm2: Preferences > Keys > Key Bindings > Remove/modify Ctrl+A
# Terminal.app: Usually doesn't intercept Ctrl+A
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 50000

# =============================================================================
# Neovim-specific settings
# =============================================================================

# Enable true color support (required for nvim colorschemes).
# tmux downsamples 24-bit color to 256 unless the terminal is flagged RGB.
# Without this, apps that see COLORTERM=truecolor (Claude Code, nvim) emit
# 24-bit escapes that tmux then truncates to 256 — colors render flat/wrong.
set -g default-terminal "tmux-256color"
set -ag update-environment "COLORTERM"
set -as terminal-features ",*:RGB"

# Reduce escape time for neovim (prevents delay when pressing Esc)
set -sg escape-time 0

# Enable focus events for neovim autocommands
set -g focus-events on

# Enable clipboard integration
set -g set-clipboard on

# =============================================================================
# Smart Pane Navigation (seamless vim/tmux navigation with Ctrl+hjkl)
# =============================================================================

# Check if current pane is running vim/nvim
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

# Ctrl + h/j/k/l - seamless navigation between tmux panes and nvim splits
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Also bind in copy-mode-vi
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# Prefix + h/j/k/l for pane navigation (backup)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt + h/j/k/l for pane navigation (alternative)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# =============================================================================
# Pane Splitting (use current directory)
# =============================================================================

# Split panes using | and - (intuitive)
bind | split-window -h -c "#{?#{==:#{pane_current_path},},#{HOME},#{pane_current_path}}"
bind - split-window -v -c "#{?#{==:#{pane_current_path},},#{HOME},#{pane_current_path}}"
bind \\ split-window -h -c "#{?#{==:#{pane_current_path},},#{HOME},#{pane_current_path}}"
bind _ split-window -v -c "#{?#{==:#{pane_current_path},},#{HOME},#{pane_current_path}}"
unbind '"'
unbind %

# =============================================================================
# Pane Resizing
# =============================================================================

# Prefix + Ctrl + hjkl for resizing
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# Prefix + arrow keys for fine resizing
bind -r Left resize-pane -L 2
bind -r Down resize-pane -D 2
bind -r Up resize-pane -U 2
bind -r Right resize-pane -R 2

# =============================================================================
# Window Navigation
# =============================================================================

# Shift + arrow to switch windows
bind -n S-Left previous-window
bind -n S-Right next-window

# Alt + number to switch windows (1-9)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Quick window cycling
bind -n M-p previous-window
bind -n M-n next-window

# =============================================================================
# Copy Mode (vim-style)
# =============================================================================

setw -g mode-keys vi

# Enter copy mode with prefix + [ or prefix + v
bind [ copy-mode
bind v copy-mode

# Visual selection and yank (vim-like)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel

# Cross-platform clipboard (auto-detect macOS vs Linux).
# macOS Terminal.app does NOT support OSC 52, so we explicitly pipe selections
# through pbcopy. iTerm2/Ghostty/WezTerm/Alacritty honor OSC 52 but pbcopy
# works in all of them too, so we always use it on Darwin.
if-shell "uname | grep -q Darwin" \
  "bind -T copy-mode-vi y               send-keys -X copy-pipe-and-cancel 'pbcopy'; \
   bind -T copy-mode-vi Enter           send-keys -X copy-pipe-and-cancel 'pbcopy'; \
   bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'; \
   bind -T copy-mode-vi DoubleClick1Pane select-pane \\; send-keys -X select-word \\; run-shell -d 0.3 \\; send-keys -X copy-pipe-and-cancel 'pbcopy'; \
   bind -T copy-mode-vi TripleClick1Pane select-pane \\; send-keys -X select-line \\; run-shell -d 0.3 \\; send-keys -X copy-pipe-and-cancel 'pbcopy'; \
   bind -T root         MouseDragEnd1Pane copy-mode -M \\; send-keys -X copy-pipe-and-cancel 'pbcopy'; \
   bind -T root         DoubleClick1Pane select-pane \\; copy-mode -M \\; send-keys -X select-word \\; run-shell -d 0.3 \\; send-keys -X copy-pipe-and-cancel 'pbcopy'; \
   bind -T root         TripleClick1Pane select-pane \\; copy-mode -M \\; send-keys -X select-line \\; run-shell -d 0.3 \\; send-keys -X copy-pipe-and-cancel 'pbcopy'" \
  "bind -T copy-mode-vi y               send-keys -X copy-pipe-and-cancel 'wl-copy 2>/dev/null || xclip -selection clipboard'; \
   bind -T copy-mode-vi Enter           send-keys -X copy-pipe-and-cancel 'wl-copy 2>/dev/null || xclip -selection clipboard'; \
   bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy 2>/dev/null || xclip -selection clipboard'"

# =============================================================================
# Misc Settings
# =============================================================================

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Kill pane without confirmation
bind x kill-pane
bind X kill-window
bind Q kill-session

# New window in current path
bind c new-window -c "#{?#{==:#{pane_current_path},},#{HOME},#{pane_current_path}}"

# Quick session switching
bind s choose-tree -Zs

# Zoom pane toggle
bind z resize-pane -Z
bind m resize-pane -Z

# Clear screen and history
bind C-l send-keys 'C-l'

# =============================================================================
# Status Bar Styling (matching nvim onedark theme)
# =============================================================================

set -g status-position bottom
set -g status-style 'bg=#2B2B2B fg=#A9B7C6'
set -g status-left-length 50
set -g status-right-length 80

set -g status-left '#[fg=#FFC66D,bold] #S #[fg=#606366]| '
set -g status-right '#[fg=#606366]| #[fg=#9876AA]#{?client_prefix,PREFIX,}#[fg=#606366] | #[fg=#6897BB]%H:%M #[fg=#606366]| #[fg=#6A8759]%d-%b-%Y '

setw -g window-status-format '#[fg=#808080] #I:#W '
setw -g window-status-current-format '#[fg=#282C34,bg=#FFC66D,bold] #I:#W #[bg=default]'

# Pane borders (matching nvim)
set -g pane-border-style 'fg=#606366'
set -g pane-active-border-style 'fg=#FFC66D'

# Message styling
set -g message-style 'fg=#FFC66D bg=#2B2B2B'

# =============================================================================
# Popup Windows
# =============================================================================

# prefix + p for popup terminal (80% width/height)
bind p display-popup -E -w 80% -h 80% -d "#{?#{==:#{pane_current_path},},#{HOME},#{pane_current_path}}"

# prefix + g for popup lazygit (if installed)
bind g display-popup -E -w 90% -h 90% -d "#{?#{==:#{pane_current_path},},#{HOME},#{pane_current_path}}" "lazygit"

# prefix + t for popup htop
bind t display-popup -E -w 80% -h 80% "htop"

# =============================================================================
# Plugins (TPM - Tmux Plugin Manager)
# =============================================================================

# Install TPM: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect settings (restore nvim sessions)
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes 'nvim vim vi'

# Auto-save sessions
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# Keybindings (automatic from plugin):
# prefix + Ctrl+s - save session
# prefix + Ctrl+r - restore session

# Initialize TPM (must be at the very bottom)
run '~/.tmux/plugins/tpm/tpm'

# =============================================================================
# Alt/Option Quick Actions (no prefix needed)
# =============================================================================

# Alt + x/X to kill pane/window instantly
bind -n M-x kill-pane
bind -n M-X kill-window

# Alt + \ and - for splits (keeps current path)
bind -n M-\\ split-window -h -c "#{?#{==:#{pane_current_path},},#{HOME},#{pane_current_path}}"
bind -n M-- split-window -v -c "#{?#{==:#{pane_current_path},},#{HOME},#{pane_current_path}}"

# =============================================================================
# Full Option/Alt Control Scheme (no prefix needed)
# =============================================================================

# Window management
bind -n M-c new-window -c "#{?#{==:#{pane_current_path},},#{HOME},#{pane_current_path}}"
bind -n M-, command-prompt -I "#W" "rename-window '%%'"
bind -n M-w choose-tree -Zw
bind -n M-s choose-tree -Zs
bind -n M-& kill-window

# Move windows left/right
bind -n M-< swap-window -t -1\; select-window -t -1
bind -n M-> swap-window -t +1\; select-window -t +1

# Session
bind -n M-d detach-client
bind -n M-Q kill-session
bind -n M-\$ command-prompt -I "#S" "rename-session '%%'"

# Pane management
bind -n M-z resize-pane -Z
bind -n M-! break-pane

# Copy mode & paste
bind -n M-[ copy-mode
bind -n M-] paste-buffer
bind -n M-v copy-mode

# Reload config
bind -n M-r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Sync panes toggle
bind -n M-S setw synchronize-panes
